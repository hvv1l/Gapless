<!DOCTYPE html>
<html lang="ru" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Gapless</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0%25' y1='0%25' x2='100%25' y2='100%25'%3E%3Cstop offset='0%25' stop-color='%230EA5E9'/%3E%3Cstop offset='100%25' stop-color='%2310B981'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='16' fill='url(%23g)'/%3E%3Ctext x='50%25' y='54%25' dominant-baseline='middle' text-anchor='middle' fill='white' font-family='Inter, Arial, sans-serif' font-weight='800' font-size='38'%3EG%3C/text%3E%3C/svg%3E" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            ocean: { 400: '#38BDF8', 500: '#0EA5E9', 600: '#0284C7' },
            mint: { 400: '#34D399', 500: '#10B981', 600: '#059669' },
            gap: { 400: '#818CF8', 500: '#6366F1', 600: '#4F46E5' }
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="style.css?v=805" />
</head>
<body class="bg-slate-50 text-slate-900 dark:bg-slate-950 dark:text-slate-100 min-h-screen flex justify-center transition-colors duration-300">

  <div class="w-full max-w-md min-h-screen flex flex-col bg-slate-50 dark:bg-slate-950 shadow-2xl relative overflow-x-hidden border-x border-slate-200/70 dark:border-slate-800/80">

    <!-- Верхняя шапка -->
    <header class="sticky top-0 z-30 backdrop-blur-md bg-white/85 dark:bg-slate-900/85 border-b border-slate-200 dark:border-slate-800 px-5 py-3.5 flex items-center justify-between">
      <button onclick="goHomeMenu()" class="flex items-center gap-2.5 text-left hover:opacity-80 transition" title="На главное меню">
        <div class="w-8 h-8 rounded-xl bg-gradient-to-br from-ocean-500 to-mint-500 flex items-center justify-center text-white font-extrabold text-base shadow-sm">G</div>
        <span class="font-extrabold tracking-tight text-base">Gapless</span>
      </button>

      <div class="flex items-center gap-2">
        <button id="header-logout-btn" onclick="AuthModule.signOut()" class="hidden px-2.5 py-1.5 rounded-lg bg-slate-100 dark:bg-slate-800 text-[11px] font-bold text-slate-500 hover:text-red-500 transition">Выйти</button>
        <button onclick="AppState.toggleTheme()" id="header-theme-btn" class="w-8 h-8 rounded-lg bg-slate-100 dark:bg-slate-800 flex items-center justify-center text-sm">🌙</button>
      </div>
    </header>

    <!-- Основной контейнер экрана -->
    <main id="app-root" class="flex-1 flex flex-col"></main>

    <!-- Нижнее меню навигации -->
    <nav id="bottom-nav" class="hidden fixed bottom-0 left-1/2 -translate-x-1/2 w-full max-w-md backdrop-blur-lg bg-white/95 dark:bg-slate-900/95 border-t border-slate-200 dark:border-slate-800 px-3 py-2 z-30">
      <div class="grid grid-cols-4 gap-1 text-center">
        <button onclick="switchAppTab('today')" id="nav-btn-today" class="py-2 rounded-xl text-xs font-bold transition">Сегодня</button>
        <button onclick="switchAppTab('exercises')" id="nav-btn-exercises" class="py-2 rounded-xl text-xs font-bold transition">Упражнения</button>
        <button onclick="switchAppTab('chat')" id="nav-btn-chat" class="py-2 rounded-xl text-xs font-bold transition">Чат</button>
        <button onclick="switchAppTab('profile')" id="nav-btn-profile" class="py-2 rounded-xl text-xs font-bold transition">Профиль</button>
      </div>
    </nav>

    <!-- Уведомления -->
    <div id="app-toast" class="fixed top-16 left-1/2 -translate-x-1/2 z-50 pointer-events-none opacity-0 translate-y-2 transition-all duration-300 bg-slate-900/95 dark:bg-white/95 text-white dark:text-slate-900 px-4 py-2 rounded-full text-xs font-semibold shadow-xl"></div>
  </div>

  <!-- ПОДКЛЮЧЕНИЕ МОДУЛЕЙ -->
  <script src="data/vocabulary.js?v=805"></script>
  <script src="data/rules.js?v=805"></script>
  <script src="js/db-service.js?v=805"></script>
  <script src="js/state.js?v=805"></script>
  <script src="js/auth.js?v=805"></script>
  <script src="js/auth-ui.js?v=805"></script>
  <script src="js/onboarding.js?v=805"></script>
  <script src="js/dashboard.js?v=805"></script>
  <script src="js/chat.js?v=805"></script>

  <script>
    // Резервная защита, если файл data/rules.js еще не загружен в папку data/
    if (typeof window.GaplessRulesDB === "undefined" && typeof GaplessRulesDB === "undefined") {
      window.GaplessRulesDB = {
        rules: [],
        videos: [],
        getRulesForLevel() { return []; },
        getDailyRules() { return []; },
        getVideosForLevel() { return []; }
      };
    } else if (typeof GaplessRulesDB !== "undefined") {
      window.GaplessRulesDB = GaplessRulesDB;
    }

    if (typeof GaplessDB !== "undefined") window.GaplessDB = GaplessDB;
    if (typeof AppState !== "undefined") window.AppState = AppState;
    if (typeof AuthModule !== "undefined") window.AuthModule = AuthModule;
    if (typeof AuthUI !== "undefined") window.AuthUI = AuthUI;
    if (typeof OnboardingModule !== "undefined") window.OnboardingModule = OnboardingModule;
    if (typeof DashboardModule !== "undefined") window.DashboardModule = DashboardModule;
    if (typeof ChatModule !== "undefined") window.ChatModule = ChatModule;

    function goHomeMenu() {
      if (!AppState.data.isAuthenticated) {
        AuthUI.renderAuthScreen();
        return;
      }
      if (!AppState.data.onboardingCompleted) {
        OnboardingModule.goToStep(1);
        return;
      }
      AppState.data.activeTab = "today";
      if (typeof DashboardModule !== "undefined") {
        DashboardModule.activeExercise = null;
        DashboardModule.isDailyRoutine = false;
      }
      AppState.save();
      renderCurrentModule();
    }

    function switchAppTab(tabId) {
      AppState.data.activeTab = tabId;
      if (typeof DashboardModule !== "undefined" && tabId !== "exercises") {
        DashboardModule.activeExercise = null;
        DashboardModule.isDailyRoutine = false;
      }
      if (tabId === "chat" && typeof ChatModule !== "undefined") {
        ChatModule.ensureConnected();
      }
      AppState.save();
      renderCurrentModule();
    }

    function updateNavigationBars() {
      const nav = document.getElementById("bottom-nav");
      const logoutBtn = document.getElementById("header-logout-btn");
      const isUk = AppState.data.nativeLang === "uk";

      if (logoutBtn) {
        logoutBtn.textContent = isUk ? "Вийти" : "Выйти";
        if (AppState.data.isAuthenticated) logoutBtn.classList.remove("hidden");
        else logoutBtn.classList.add("hidden");
      }

      if (!AppState.data.isAuthenticated || !AppState.data.onboardingCompleted) {
        if (nav) nav.classList.add("hidden");
        return;
      }
      if (nav) nav.classList.remove("hidden");

      const labels = {
        today: isUk ? "Сьогодні" : "Сегодня",
        exercises: isUk ? "Вправи" : "Упражнения",
        chat: isUk ? "Чат" : "Чат",
        profile: isUk ? "Профіль" : "Профиль"
      };

      ["today", "exercises", "chat", "profile"].forEach(id => {
        const btn = document.getElementById(`nav-btn-${id}`);
        if (!btn) return;
        btn.textContent = labels[id];
        btn.className = AppState.data.activeTab === id
          ? "py-2 rounded-xl text-xs font-extrabold bg-ocean-500/15 text-ocean-600 dark:text-ocean-400 transition"
          : "py-2 rounded-xl text-xs font-semibold text-slate-500 hover:text-slate-800 dark:hover:text-slate-200 transition";
      });
    }

    function renderCurrentModule() {
      const rootContainer = document.getElementById("app-root");
      try {
        if (typeof AppState === "undefined" || typeof GaplessDB === "undefined") {
          throw new Error("Не загружена база слов (проверь файл data/vocabulary.js и js/db-service.js)");
        }

        updateNavigationBars();
        if (rootContainer) rootContainer.innerHTML = "";

        if (!AppState.data.isAuthenticated) {
          AuthUI.renderAuthScreen();
          return;
        }

        if (!AppState.data.onboardingCompleted) {
          if (![1, 2, 3, 4].includes(AppState.data.onboardingStep)) {
            AppState.data.onboardingStep = 1;
          }
          OnboardingModule.render();
          return;
        }

        const tab = AppState.data.activeTab || "today";
        if (tab === "chat") {
          ChatModule.render();
        } else {
          DashboardModule.render();
        }
      } catch (err) {
        console.error("Ошибка рендера:", err);
        if (rootContainer) {
          rootContainer.innerHTML = `
            <div class="p-6 my-auto text-center space-y-3">
              <div class="text-3xl">⚠️</div>
              <div class="text-sm font-extrabold text-red-400">Ошибка загрузки модуля</div>
              <div class="p-3 rounded-xl bg-slate-900 border border-slate-800 text-xs font-mono text-slate-300 break-words">
                ${err.message || err}
              </div>
              <button onclick="localStorage.clear(); location.reload();" class="px-4 py-2.5 rounded-xl bg-ocean-600 text-white text-xs font-bold">
                Сбросить кэш и перезагрузить
              </button>
            </div>
          `;
        }
      }
    }

    window.renderCurrentModule = renderCurrentModule;
    window.switchAppTab = switchAppTab;
    window.goHomeMenu = goHomeMenu;
    window.updateNavigationBars = updateNavigationBars;

    async function bootstrapApp() {
      if (typeof AppState !== "undefined") {
        AppState.init();
      }
      // Сначала мгновенно рисуем интерфейс без ожидания сети
      renderCurrentModule();

      // Затем в фоне синхронизируем сессию Supabase
      if (window.supabaseClient && typeof AuthModule !== "undefined") {
        try {
          const { data: { session } } = await window.supabaseClient.auth.getSession();
          if (session && session.user) {
            await AuthModule.syncProfileFromSession(session.user);
            renderCurrentModule();
          }
        } catch (e) {}
      }
    }

    window.addEventListener("DOMContentLoaded", bootstrapApp);
  </script>
</body>
</html>
