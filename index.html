<!DOCTYPE html>
<html lang="ru" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Gapless</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0%25' y1='0%25' x2='100%25' y2='100%25'%3E%3Cstop offset='0%25' stop-color='%230EA5E9'/%3E%3Cstop offset='100%25' stop-color='%2310B981'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='16' fill='url(%23g)'/%3E%3Ctext x='50%25' y='54%25' dominant-baseline='middle' text-anchor='middle' fill='white' font-family='Inter, Arial, sans-serif' font-weight='800' font-size='38'%3EG%3C/text%3E%3C/svg%3E" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            ocean: { 400: '#38BDF8', 500: '#0EA5E9', 600: '#0284C7' },
            mint: { 400: '#34D399', 500: '#10B981', 600: '#059669' },
            gap: { 400: '#818CF8', 500: '#6366F1', 600: '#4F46E5' }
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="style.css?v=600" />
</head>
<body class="bg-slate-50 text-slate-900 dark:bg-slate-950 dark:text-slate-100 min-h-screen flex justify-center transition-colors duration-300">

  <div class="w-full max-w-md min-h-screen flex flex-col bg-slate-50 dark:bg-slate-950 shadow-2xl relative overflow-x-hidden border-x border-slate-200/70 dark:border-slate-800/80">

    <!-- Верхняя шапка -->
    <header class="sticky top-0 z-30 backdrop-blur-md bg-white/85 dark:bg-slate-900/85 border-b border-slate-200 dark:border-slate-800 px-5 py-3.5 flex items-center justify-between">
      <button onclick="switchAppTab('today')" class="flex items-center gap-2.5 text-left hover:opacity-80 transition">
        <div class="w-8 h-8 rounded-xl bg-gradient-to-br from-ocean-500 to-mint-500 flex items-center justify-center text-white font-extrabold text-base shadow-sm">G</div>
        <span class="font-extrabold tracking-tight text-base">Gapless</span>
      </button>

      <div class="flex items-center gap-2">
        <button id="header-logout-btn" onclick="AuthModule.signOut()" class="hidden px-2.5 py-1.5 rounded-lg bg-slate-100 dark:bg-slate-800 text-[11px] font-bold text-slate-500 hover:text-red-500 transition">Выйти</button>
        <button onclick="AppState.toggleTheme()" id="header-theme-btn" class="w-8 h-8 rounded-lg bg-slate-100 dark:bg-slate-800 flex items-center justify-center text-sm">🌙</button>
      </div>
    </header>

    <!-- Основной контейнер экрана -->
    <main id="app-root" class="flex-1 flex flex-col pb-24"></main>

    <!-- Нижнее меню навигации -->
    <nav id="bottom-nav" class="hidden fixed bottom-0 left-1/2 -translate-x-1/2 w-full max-w-md backdrop-blur-lg bg-white/95 dark:bg-slate-900/95 border-t border-slate-200 dark:border-slate-800 px-3 py-2 z-30">
      <div class="grid grid-cols-4 gap-1 text-center">
        <button onclick="switchAppTab('today')" id="nav-btn-today" class="py-2 rounded-xl text-xs font-bold transition">Сегодня</button>
        <button onclick="switchAppTab('exercises')" id="nav-btn-exercises" class="py-2 rounded-xl text-xs font-bold transition">Упражнения</button>
        <button onclick="switchAppTab('chat')" id="nav-btn-chat" class="py-2 rounded-xl text-xs font-bold transition">Чат</button>
        <button onclick="switchAppTab('profile')" id="nav-btn-profile" class="py-2 rounded-xl text-xs font-bold transition">Профиль</button>
      </div>
    </nav>

    <!-- Уведомления -->
    <div id="app-toast" class="fixed top-16 left-1/2 -translate-x-1/2 z-50 pointer-events-none opacity-0 translate-y-2 transition-all duration-300 bg-slate-900/95 dark:bg-white/95 text-white dark:text-slate-900 px-4 py-2 rounded-full text-xs font-semibold shadow-xl"></div>
  </div>

  <!-- СКРИПТЫ -->
  <script src="data/vocabulary.js?v=600"></script>
  <script src="js/db-service.js?v=600"></script>
  <script src="js/state.js?v=600"></script>
  <script src="js/auth.js?v=600"></script>
  <script src="js/auth-ui.js?v=600"></script>
  <script src="js/onboarding.js?v=600"></script>
  <script src="js/dashboard.js?v=600"></script>
  <script src="js/chat.js?v=600"></script>

  <script>
    function switchAppTab(tabId) {
      AppState.data.activeTab = tabId;
      AppState.save();
      renderCurrentModule();
    }

    function updateNavigationBars() {
      const nav = document.getElementById("bottom-nav");
      const logoutBtn = document.getElementById("header-logout-btn");
      const isUk = AppState.data.nativeLang === "uk";

      if (logoutBtn) {
        logoutBtn.textContent = isUk ? "Вийти" : "Выйти";
        if (AppState.data.isAuthenticated) logoutBtn.classList.remove("hidden");
        else logoutBtn.classList.add("hidden");
      }

      if (!AppState.data.isAuthenticated) {
        if (nav) nav.classList.add("hidden");
        return;
      }
      if (nav) nav.classList.remove("hidden");

      const labels = {
        today: isUk ? "Сьогодні" : "Сегодня",
        exercises: isUk ? "Вправи" : "Упражнения",
        chat: isUk ? "Чат" : "Чат",
        profile: isUk ? "Профіль" : "Профиль"
      };

      ["today", "exercises", "chat", "profile"].forEach(id => {
        const btn = document.getElementById(`nav-btn-${id}`);
        if (!btn) return;
        btn.textContent = labels[id];
        btn.className = AppState.data.activeTab === id
          ? "py-2 rounded-xl text-xs font-extrabold bg-ocean-500/15 text-ocean-600 dark:text-ocean-400 transition"
          : "py-2 rounded-xl text-xs font-semibold text-slate-500 hover:text-slate-800 dark:hover:text-slate-200 transition";
      });
    }

    function renderCurrentModule() {
      updateNavigationBars();
      const root = document.getElementById("app-root");
      if (!root) return;
      root.innerHTML = "";

      // 1. Если не авторизован — показываем экран входа
      if (!AppState.data.isAuthenticated) {
        if (window.AuthUI && typeof AuthUI.renderAuthScreen === "function") {
          AuthUI.renderAuthScreen();
        } else {
          root.innerHTML = `<div class="p-6 text-center text-xs">Загрузка авторизации...</div>`;
        }
        return;
      }

      const tab = AppState.data.activeTab || "today";
      const isUk = AppState.data.nativeLang === "uk";
      const userName = AppState.data.userName || "Alex";
      const level = AppState.data.selectedLevel || "B1";
      const stats = window.GaplessDB ? GaplessDB.getStatistics(level) : { known: 0, gaps: 0 };

      // 2. ВКЛАДКА ЧАТ
      if (tab === "chat") {
        if (window.ChatModule && typeof ChatModule.render === "function") {
          ChatModule.render();
        } else {
          root.innerHTML = `<div class="p-5 text-xs text-center text-slate-400">Загрузка чата...</div>`;
        }
        return;
      }

      // 3. ВКЛАДКА УПРАЖНЕНИЯ
      if (tab === "exercises") {
        root.innerHTML = `
          <div class="p-5 space-y-4 fade-in">
            <h1 class="text-xl font-extrabold">${isUk ? 'Вправи' : 'Упражнения'}</h1>
            <div onclick="showToast('Запуск карточек пропусков...')" class="p-4 rounded-2xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 cursor-pointer hover:border-ocean-500 transition flex items-center justify-between shadow-sm">
              <div>
                <div class="text-sm font-bold text-ocean-500">🃏 ${isUk ? 'Картки моїх прогалин' : 'Карточки моих пробелов'}</div>
                <div class="text-xs text-slate-400 mt-0.5">${isUk ? `Слів у прогалинах: ${stats.gaps}` : `Слов в пробелах: ${stats.gaps}`}</div>
              </div>
              <span class="text-slate-400">→</span>
            </div>
          </div>
        `;
        return;
      }

      // 4. ВКЛАДКА ПРОФИЛЬ
      if (tab === "profile") {
        root.innerHTML = `
          <div class="p-5 space-y-4 fade-in">
            <div class="p-6 rounded-3xl bg-gradient-to-br from-ocean-600 to-mint-600 text-white shadow-xl space-y-2">
              <div class="text-xl font-extrabold">${userName}</div>
              <div class="text-xs opacity-85">${AppState.data.userEmail || 'no email'}</div>
              <div class="text-xs font-bold pt-1">Уровень: ${level}</div>
            </div>
            <div class="grid grid-cols-2 gap-3">
              <div class="p-4 rounded-2xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 text-center">
                <div class="text-2xl font-extrabold text-mint-500">${stats.known}</div>
                <div class="text-xs text-slate-400 mt-1">Изучено слов</div>
              </div>
              <div class="p-4 rounded-2xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 text-center">
                <div class="text-2xl font-extrabold text-gap-500">${stats.gaps}</div>
                <div class="text-xs text-slate-400 mt-1">Пробелы</div>
              </div>
            </div>
          </div>
        `;
        return;
      }

      // 5. ВКЛАДКА СЕГОДНЯ (Главная)
      root.innerHTML = `
        <div class="p-5 space-y-4 fade-in">
          <div class="p-6 rounded-3xl bg-gradient-to-br from-ocean-500 to-mint-500 text-white shadow-xl space-y-3">
            <div class="flex items-center justify-between">
              <span class="text-xs uppercase font-extrabold opacity-85">Gapless Daily</span>
              <span class="px-2.5 py-1 rounded-full bg-white/20 text-xs font-bold">Level ${level}</span>
            </div>
            <div>
              <h2 class="text-2xl font-extrabold">${isUk ? 'Привіт, ' : 'Привет, '}${userName}!</h2>
              <p class="text-xs opacity-90 mt-0.5">${isUk ? 'Твоя щоденна база слів готова до повторення.' : 'Твоя ежедневная база слов готова к повторению.'}</p>
            </div>
            <div class="grid grid-cols-2 gap-2 pt-1">
              <div class="bg-black/15 p-3 rounded-2xl text-center">
                <div class="text-lg font-extrabold text-mint-200">${stats.known}</div>
                <div class="text-[10px] opacity-80">${isUk ? 'Вивчено' : 'Изучено'}</div>
              </div>
              <div class="bg-black/15 p-3 rounded-2xl text-center">
                <div class="text-lg font-extrabold text-amber-200">${stats.gaps}</div>
                <div class="text-[10px] opacity-80">${isUk ? 'Прогалини' : 'Пробелы'}</div>
              </div>
            </div>
          </div>

          <button onclick="switchAppTab('chat')" class="w-full p-4 rounded-2xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 text-left hover:border-ocean-500 transition flex items-center justify-between shadow-sm">
            <div class="flex items-center gap-3">
              <div class="w-10 h-10 rounded-xl bg-mint-500/15 flex items-center justify-center text-lg">💬</div>
              <div>
                <div class="text-sm font-extrabold">Онлайн чат практики</div>
                <div class="text-xs text-slate-400">Общение с AI и друзьями</div>
              </div>
            </div>
            <span class="text-mint-500 font-bold">→</span>
          </button>
        </div>
      `;
    }

    async function bootstrapApp() {
      AppState.init();
      if (window.supabaseClient && window.AuthModule) {
        try {
          const { data: { session } } = await window.supabaseClient.auth.getSession();
          if (session && session.user) {
            await AuthModule.syncProfileFromSession(session.user);
          }
        } catch (e) {}
      }
      renderCurrentModule();
    }

    bootstrapApp();
  </script>
</body>
</html>
