<!DOCTYPE html>
<html lang="ru" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Gapless</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0%25' y1='0%25' x2='100%25' y2='100%25'%3E%3Cstop offset='0%25' stop-color='%230EA5E9'/%3E%3Cstop offset='100%25' stop-color='%2310B981'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='16' fill='url(%23g)'/%3E%3Ctext x='50%25' y='54%25' dominant-baseline='middle' text-anchor='middle' fill='white' font-family='Inter, Arial, sans-serif' font-weight='800' font-size='38'%3EG%3C/text%3E%3C/svg%3E" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            ocean: { 400: '#38BDF8', 500: '#0EA5E9', 600: '#0284C7' },
            mint: { 400: '#34D399', 500: '#10B981', 600: '#059669' },
            gap: { 400: '#818CF8', 500: '#6366F1', 600: '#4F46E5' }
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="style.css?v=100" />
  <style>
    body { font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
    input, textarea { -webkit-user-select: text !important; user-select: text !important; }
    .perspective { perspective: 1000px; }
    .flip-card { transform-style: preserve-3d; transition: transform 0.4s ease; }
    .flip-card.flipped { transform: rotateY(180deg); }
    .flip-face { backface-visibility: hidden; -webkit-backface-visibility: hidden; }
    .flip-back { transform: rotateY(180deg); }
  </style>
</head>
<body class="bg-slate-50 text-slate-900 dark:bg-slate-950 dark:text-slate-100 min-h-screen flex justify-center">

  <div class="w-full max-w-md min-h-screen flex flex-col bg-slate-50 dark:bg-slate-950 shadow-2xl relative overflow-x-hidden border-x border-slate-200/70 dark:border-slate-800/80">

    <!-- Шапка -->
    <header class="sticky top-0 z-30 backdrop-blur-md bg-white/85 dark:bg-slate-900/85 border-b border-slate-200 dark:border-slate-800 px-5 py-3.5 flex items-center justify-between">
      <button onclick="GaplessApp.goHome()" class="flex items-center gap-2.5 text-left hover:opacity-80 transition">
        <div class="w-8 h-8 rounded-xl bg-gradient-to-br from-ocean-500 to-mint-500 flex items-center justify-center text-white font-extrabold text-base shadow-sm">G</div>
        <span class="font-extrabold tracking-tight text-base">Gapless</span>
      </button>

      <div class="flex items-center gap-2">
        <button id="logout-btn" onclick="GaplessApp.signOut()" class="hidden px-2.5 py-1.5 rounded-lg bg-slate-100 dark:bg-slate-800 text-[11px] font-bold text-slate-500 hover:text-red-500 transition">Выйти</button>
        <button onclick="GaplessApp.toggleTheme()" class="w-8 h-8 rounded-lg bg-slate-100 dark:bg-slate-800 flex items-center justify-center text-sm">🌙</button>
      </div>
    </header>

    <!-- Основной контейнер экрана -->
    <main id="app-root" class="flex-1 flex flex-col"></main>

    <!-- Нижнее меню -->
    <nav id="bottom-nav" class="hidden fixed bottom-0 left-1/2 -translate-x-1/2 w-full max-w-md backdrop-blur-lg bg-white/95 dark:bg-slate-900/95 border-t border-slate-200 dark:border-slate-800 px-3 py-2 z-30">
      <div class="grid grid-cols-4 gap-1 text-center text-xs font-bold">
        <button onclick="GaplessApp.switchTab('today')" id="tab-today" class="py-2 rounded-xl transition">Сегодня</button>
        <button onclick="GaplessApp.switchTab('exercises')" id="tab-exercises" class="py-2 rounded-xl transition">Упражнения</button>
        <button onclick="GaplessApp.switchTab('chat')" id="tab-chat" class="py-2 rounded-xl transition">Чат</button>
        <button onclick="GaplessApp.switchTab('profile')" id="tab-profile" class="py-2 rounded-xl transition">Профиль</button>
      </div>
    </nav>

    <!-- Тост -->
    <div id="app-toast" class="fixed top-16 left-1/2 -translate-x-1/2 z-50 pointer-events-none opacity-0 translate-y-2 transition-all duration-300 bg-slate-900 text-white dark:bg-white dark:text-slate-900 px-4 py-2 rounded-full text-xs font-semibold shadow-xl"></div>
  </div>

  <script src="data/vocabulary.js?v=100"></script>
  <script src="js/db-service.js?v=100"></script>

  <script>
    // 🔑 ВСТАВЬ СВОИ КЛЮЧИ SUPABASE (если нужно):
    const SUPABASE_URL = "";
    const SUPABASE_ANON_KEY = "";

    window.supabaseClient = (window.supabase && SUPABASE_URL.startsWith("https://") && !SUPABASE_URL.includes("ТВОЙ"))
      ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;

    function showToast(msg) {
      const t = document.getElementById("app-toast");
      if (!t) return;
      t.textContent = msg;
      t.classList.remove("opacity-0", "translate-y-2");
      t.classList.add("opacity-100", "translate-y-0");
      setTimeout(() => {
        t.classList.remove("opacity-100", "translate-y-0");
        t.classList.add("opacity-0", "translate-y-2");
      }, 2000);
    }

    const GaplessApp = {
      state: {
        isAuthenticated: false,
        userName: "Alex",
        userEmail: "alex@gmail.com",
        selectedLevel: "B1",
        nativeLang: "ru",
        theme: "dark",
        activeTab: "today",
        subExercise: null, // null | 'cards' | 'chat'
        cardIndex: 0,
        isFlipped: false,
        chatSubTab: 'ai',
        chatMessages: [
          { sender: 'Liam (AI)', text: "Hi! How was your day? Ready to practice English?" }
        ],
        friends: []
      },

      init() {
        try {
          const saved = localStorage.getItem("gapless_full_state_v2");
          if (saved) this.state = { ...this.state, ...JSON.parse(saved) };
        } catch(e) {}
        this.applyTheme();
        this.render();
      },

      save() {
        try {
          localStorage.setItem("gapless_full_state_v2", JSON.stringify(this.state));
        } catch(e) {}
      },

      applyTheme() {
        if (this.state.theme === "dark") document.documentElement.classList.add("dark");
        else document.documentElement.classList.remove("dark");
      },

      toggleTheme() {
        this.state.theme = this.state.theme === "dark" ? "light" : "dark";
        this.applyTheme();
        this.save();
        this.render();
      },

      switchTab(tab) {
        this.state.activeTab = tab;
        this.state.subExercise = null;
        this.save();
        this.render();
      },

      goHome() {
        this.state.activeTab = "today";
        this.state.subExercise = null;
        this.save();
        this.render();
      },

      signOut() {
        this.state.isAuthenticated = false;
        this.save();
        showToast("Вы вышли из аккаунта");
        this.render();
      },

      startCards() {
        this.state.subExercise = 'cards';
        this.state.cardIndex = 0;
        this.state.isFlipped = false;
        this.render();
      },

      nextCard(known) {
        const gaps = GaplessDB.getUserGapWords(this.state.selectedLevel);
        const currentWord = gaps[this.state.cardIndex];
        if (currentWord && known) {
          GaplessDB.setWordStatus(currentWord.en, "known");
          showToast("✓ Слово изучено!");
        }
        this.state.isFlipped = false;
        this.state.cardIndex++;
        this.render();
      },

      sendChatMessage() {
        const input = document.getElementById("chat-input");
        if (!input || !input.value.trim()) return;
        const text = input.value.trim();
        input.value = "";

        this.state.chatMessages.push({ sender: this.state.userName, text });
        this.render();

        setTimeout(() => {
          this.state.chatMessages.push({ sender: "Liam (AI)", text: "That's great! Tell me more about it." });
          this.render();
        }, 800);
      },

      render() {
        const root = document.getElementById("app-root");
        const nav = document.getElementById("bottom-nav");
        const logoutBtn = document.getElementById("logout-btn");
        if (!root) return;

        const isUk = this.state.nativeLang === "uk";

        // Экран входа
        if (!this.state.isAuthenticated) {
          if (nav) nav.classList.add("hidden");
          if (logoutBtn) logoutBtn.classList.add("hidden");
          root.innerHTML = `
            <div class="p-6 my-auto flex-1 flex flex-col justify-center max-w-sm mx-auto w-full space-y-4">
              <div class="text-center space-y-2">
                <div class="w-14 h-14 rounded-2xl bg-gradient-to-br from-ocean-500 to-mint-500 flex items-center justify-center text-white font-extrabold text-2xl mx-auto shadow-lg">G</div>
                <h1 class="text-2xl font-extrabold">${isUk ? 'Вхід у Gapless' : 'Вход в Gapless'}</h1>
                <p class="text-xs text-slate-400">${isUk ? 'Увійди для збереження твоїх прогалин' : 'Войди для сохранения твоих пробелов и прогресса'}</p>
              </div>
              <div class="space-y-3 p-4 rounded-2xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800">
                <input id="login-name" type="text" placeholder="${isUk ? 'Твоє ім’я' : 'Твое имя'}" value="${this.state.userName}" class="w-full px-3.5 py-2.5 rounded-xl bg-slate-100 dark:bg-slate-800 text-xs outline-none" />
                <button onclick="GaplessApp.state.userName = document.getElementById('login-name').value || 'Alex'; GaplessApp.state.isAuthenticated = true; GaplessApp.save(); GaplessApp.render(); showToast('✓ Добро пожаловать!');"
                  class="w-full py-3.5 rounded-xl bg-gradient-to-r from-ocean-600 to-mint-600 text-white font-bold text-xs shadow-md">
                  ${isUk ? 'Увійти в додаток →' : 'Войти в приложение →'}
                </button>
              </div>
            </div>
          `;
          return;
        }

        if (nav) nav.classList.remove("hidden");
        if (logoutBtn) logoutBtn.classList.remove("hidden");

        const tab = this.state.activeTab || "today";

        // Подсветка меню
        ["today", "exercises", "chat", "profile"].forEach(id => {
          const btn = document.getElementById(`tab-${id}`);
          if (btn) {
            btn.className = tab === id
              ? "py-2 rounded-xl text-xs font-extrabold bg-ocean-500/15 text-ocean-600 dark:text-ocean-400 transition"
              : "py-2 rounded-xl text-xs font-semibold text-slate-500 hover:text-slate-800 dark:hover:text-slate-200 transition";
          }
        });

        // 1. УПРАЖНЕНИЕ: КАРТОЧКИ ПРОБЕЛОВ (15-минутка)
        if (tab === 'exercises' && this.state.subExercise === 'cards') {
          const gaps = GaplessDB.getUserGapWords(this.state.selectedLevel);
          const currentWord = gaps[this.state.cardIndex];

          if (!currentWord || this.state.cardIndex >= gaps.length) {
            root.innerHTML = `
              <div class="p-6 my-auto text-center space-y-4">
                <div class="w-16 h-16 bg-mint-500/20 text-mint-500 rounded-full flex items-center justify-center text-3xl mx-auto">🎉</div>
                <h2 class="text-xl font-extrabold">${isUk ? 'Тренування завершено!' : 'Тренировка завершена!'}</h2>
                <p class="text-xs text-slate-400">${isUk ? 'Ти пройшов усі слова у своїх прогалинах.' : 'Ты успешно повторил все слова из своих пробелов.'}</p>
                <button onclick="GaplessApp.state.subExercise = null; GaplessApp.render();" class="px-6 py-3 rounded-xl bg-ocean-600 text-white text-xs font-bold">
                  ${isUk ? '← Назад до вправ' : '← Назад к упражнениям'}
                </button>
              </div>
            `;
            return;
          }

          root.innerHTML = `
            <div class="p-5 flex flex-col h-[calc(100vh-120px)] justify-between fade-in">
              <div class="flex items-center justify-between">
                <button onclick="GaplessApp.state.subExercise = null; GaplessApp.render();" class="text-xs font-bold text-ocean-500">← ${isUk ? 'Назад' : 'Назад'}</button>
                <span class="text-xs font-bold text-slate-400">${this.state.cardIndex + 1} / ${gaps.length}</span>
              </div>

              <div class="perspective w-full max-w-xs mx-auto h-64 cursor-pointer" onclick="GaplessApp.state.isFlipped = !GaplessApp.state.isFlipped; GaplessApp.render();">
                <div class="flip-card w-full h-full relative rounded-3xl shadow-xl ${this.state.isFlipped ? 'flipped' : ''}">
                  <div class="flip-face absolute inset-0 bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-3xl flex flex-col items-center justify-center p-6 text-center">
                    <span class="text-2xl font-extrabold text-ocean-500 mb-2">${currentWord.en}</span>
                    <span class="text-[11px] text-slate-400">${isUk ? 'Натисни, щоб перевернути' : 'Нажми, чтобы перевернуть'}</span>
                  </div>
                  <div class="flip-face flip-back absolute inset-0 bg-gradient-to-br from-ocean-600 to-mint-600 text-white rounded-3xl flex flex-col items-center justify-center p-6 text-center">
                    <span class="text-xl font-extrabold mb-1">${currentWord.getTranslation(this.state.nativeLang)}</span>
                    <span class="text-xs opacity-90">${currentWord.example || ''}</span>
                  </div>
                </div>
              </div>

              <div class="grid grid-cols-2 gap-3 pb-4">
                <button onclick="GaplessApp.nextCard(false)" class="py-3.5 rounded-xl bg-amber-500/15 text-amber-600 dark:text-amber-400 font-bold text-xs">
                  ${isUk ? 'Ще вчити' : 'Еще учу'}
                </button>
                <button onclick="GaplessApp.nextCard(true)" class="py-3.5 rounded-xl bg-mint-500/15 text-mint-600 dark:text-mint-400 font-bold text-xs">
                  ✓ ${isUk ? 'Знаю' : 'Знаю'}
                </button>
              </div>
            </div>
          `;
          return;
        }

        // 2. ВКЛАДКА «СЕГОДНЯ» (Главное меню)
        if (tab === "today") {
          const stats = GaplessDB.getStatistics(this.state.selectedLevel);
          root.innerHTML = `
            <div class="p-5 space-y-4 pb-24 fade-in">
              <div class="p-6 rounded-3xl bg-gradient-to-br from-ocean-500 to-mint-500 text-white shadow-xl space-y-3">
                <div class="flex items-center justify-between">
                  <span class="text-xs uppercase font-extrabold opacity-85">Gapless Daily</span>
                  <span class="px-2.5 py-1 rounded-full bg-white/20 text-xs font-bold">Level ${this.state.selectedLevel}</span>
                </div>
                <div>
                  <h2 class="text-2xl font-extrabold">${isUk ? 'Привіт, ' : 'Привет, '}${this.state.userName}!</h2>
                  <p class="text-xs opacity-90 mt-0.5">${isUk ? 'Твоя щоденна база слів готова до повторення.' : 'Твоя ежедневная база слов готова к повторению.'}</p>
                </div>
                <div class="grid grid-cols-2 gap-2 pt-1">
                  <div class="bg-black/15 p-3 rounded-2xl text-center">
                    <div class="text-lg font-extrabold text-mint-200">${stats.known}</div>
                    <div class="text-[10px] opacity-80">${isUk ? 'Вивчено' : 'Изучено'}</div>
                  </div>
                  <div class="bg-black/15 p-3 rounded-2xl text-center">
                    <div class="text-lg font-extrabold text-amber-200">${stats.gaps}</div>
                    <div class="text-[10px] opacity-80">${isUk ? 'Прогалини' : 'Пробелы'}</div>
                  </div>
                </div>
              </div>

              <div class="space-y-3">
                <button onclick="GaplessApp.switchTab('exercises'); GaplessApp.startCards();" class="w-full p-4 rounded-2xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 text-left hover:border-ocean-500 transition flex items-center justify-between shadow-sm">
                  <div class="flex items-center gap-3">
                    <div class="w-10 h-10 rounded-xl bg-ocean-500/15 flex items-center justify-center text-lg">🚀</div>
                    <div>
                      <div class="text-sm font-extrabold">${isUk ? 'Розпочати 15-хвилинку' : 'Начать 15-минутку'}</div>
                      <div class="text-xs text-slate-400">${isUk ? 'Картки твоїх прогалин' : 'Карточки твоих пробелов'} (${stats.gaps} сл.)</div>
                    </div>
                  </div>
                  <span class="text-ocean-500 font-bold">→</span>
                </button>

                <button onclick="GaplessApp.switchTab('chat')" class="w-full p-4 rounded-2xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 text-left hover:border-ocean-500 transition flex items-center justify-between shadow-sm">
                  <div class="flex items-center gap-3">
                    <div class="w-10 h-10 rounded-xl bg-mint-500/15 flex items-center justify-center text-lg">💬</div>
                    <div>
                      <div class="text-sm font-extrabold">${isUk ? 'Онлайн чат практики' : 'Онлайн чат практики'}</div>
                      <div class="text-xs text-slate-400">${isUk ? 'Спілкування з AI та друзями' : 'Общение с AI и друзьями'}</div>
                    </div>
                  </div>
                  <span class="text-mint-500 font-bold">→</span>
                </button>
              </div>
            </div>
          `;
        } 
        // 3. ВКЛАДКА «УПРАЖНЕНИЯ»
        else if (tab === "exercises") {
          const stats = GaplessDB.getStatistics(this.state.selectedLevel);
          root.innerHTML = `
            <div class="p-5 space-y-4 pb-24 fade-in">
              <div>
                <h1 class="text-xl font-extrabold tracking-tight">${isUk ? 'Вправи' : 'Упражнения'}</h1>
                <p class="text-xs text-slate-500">${isUk ? 'Обирай інструмент для тренування' : 'Выбирай инструмент для тренировки'}</p>
              </div>

              <div class="space-y-3">
                <div onclick="GaplessApp.startCards()" class="p-4 rounded-2xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 cursor-pointer hover:border-ocean-500/50 transition flex items-center justify-between">
                  <div>
                    <div class="text-sm font-bold text-ocean-500">🃏 ${isUk ? 'Картки моїх прогалин' : 'Карточки моих пробелов'}</div>
                    <div class="text-xs text-slate-400 mt-0.5">${isUk ? `Тренування слів (${stats.gaps} сл.)` : `Тренировка слов (${stats.gaps} сл.)`}</div>
                  </div>
                  <span class="text-slate-400">→</span>
                </div>
              </div>
            </div>
          `;
        } 
        // 4. ВКЛАДКА «ЧАТ»
        else if (tab === "chat") {
          const messagesHtml = this.state.chatMessages.map(m => `
            <div class="flex flex-col mb-2.5">
              <span class="text-[10px] text-slate-400 ml-1 mb-0.5 font-bold">${m.sender}</span>
              <div class="max-w-[80%] p-3 rounded-2xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 text-xs text-slate-800 dark:text-slate-200 shadow-sm">
                ${m.text}
              </div>
            </div>
          `).join("");

          root.innerHTML = `
            <div class="flex flex-col h-[calc(100vh-130px)] fade-in">
              <div class="p-3 bg-white dark:bg-slate-900 border-b border-slate-200 dark:border-slate-800 flex justify-center">
                <div class="grid grid-cols-2 bg-slate-100 dark:bg-slate-800 p-1 rounded-xl text-xs font-bold w-48 text-center">
                  <span class="py-1 rounded-lg bg-white dark:bg-slate-900 text-ocean-500 shadow-sm">AI Напарник</span>
                  <span class="py-1 rounded-lg text-slate-500">Друзья</span>
                </div>
              </div>

              <div class="flex-1 overflow-y-auto p-4 space-y-2">
                ${messagesHtml}
              </div>

              <div class="p-3 bg-white dark:bg-slate-900 border-t border-slate-200 dark:border-slate-800 flex items-center gap-2">
                <input id="chat-input" type="text" placeholder="${isUk ? 'Напиши повідомлення англійською...' : 'Напиши сообщение на английском...'}" 
                  onkeydown="if(event.key==='Enter') GaplessApp.sendChatMessage()"
                  class="flex-1 px-4 py-2.5 rounded-xl bg-slate-100 dark:bg-slate-800 text-xs outline-none" />
                <button onclick="GaplessApp.sendChatMessage()" class="px-4 py-2.5 rounded-xl bg-ocean-600 text-white text-xs font-bold">
                  ${isUk ? 'Надіслати' : 'Отправить'}
                </button>
              </div>
            </div>
          `;
        } 
        // 5. ВКЛАДКА «ПРОФИЛЬ»
        else if (tab === "profile") {
          const stats = GaplessDB.getStatistics(this.state.selectedLevel);
          root.innerHTML = `
            <div class="p-5 space-y-4 pb-24 fade-in">
              <div class="p-6 rounded-3xl bg-gradient-to-br from-ocean-600 to-mint-600 text-white shadow-xl space-y-3">
                <div class="flex items-center justify-between">
                  <span class="text-xs uppercase font-extrabold opacity-80">Gapless Profile</span>
                  <span class="px-2.5 py-1 rounded-full bg-white/20 text-xs font-bold">${this.state.selectedLevel}</span>
                </div>
                <div>
                  <div class="text-xl font-extrabold">${this.state.userName}</div>
                  <div class="text-xs opacity-85">${this.state.userEmail}</div>
                </div>
              </div>

              <div class="grid grid-cols-2 gap-3">
                <div class="p-4 rounded-2xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 text-center">
                  <div class="text-2xl font-extrabold text-mint-500">${stats.known}</div>
                  <div class="text-xs text-slate-400 font-semibold mt-1">${isUk ? 'Вивчено слів' : 'Изучено слов'}</div>
                </div>
                <div class="p-4 rounded-2xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 text-center">
                  <div class="text-2xl font-extrabold text-gap-500">${stats.gaps}</div>
                  <div class="text-xs text-slate-400 font-semibold mt-1">${isUk ? 'Мої прогалини' : 'Мои пробелы'}</div>
                </div>
              </div>

              <div class="p-4 rounded-2xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 space-y-3">
                <div class="text-xs font-bold uppercase text-slate-400">${isUk ? 'Мова' : 'Язык'}</div>
                <div class="flex gap-2">
                  <button onclick="GaplessApp.state.nativeLang='ru'; GaplessApp.save(); GaplessApp.render();" class="flex-1 py-2 rounded-xl text-xs font-bold ${this.state.nativeLang==='ru' ? 'bg-ocean-500 text-white' : 'bg-slate-100 dark:bg-slate-800 text-slate-500'}">RU</button>
                  <button onclick="GaplessApp.state.nativeLang='uk'; GaplessApp.save(); GaplessApp.render();" class="flex-1 py-2 rounded-xl text-xs font-bold ${this.state.nativeLang==='uk' ? 'bg-ocean-500 text-white' : 'bg-slate-100 dark:bg-slate-800 text-slate-500'}">UA</button>
                </div>
              </div>
            </div>
          `;
        }
      }
    };

    GaplessApp.init();
  </script>
</body>
</html>
